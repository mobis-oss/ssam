[target.aarch64-unknown-linux-musl]
linker = "aarch64-linux-gnu-gcc"

[target.x86_64-unknown-linux-musl]
linker = "x86_64-linux-gnu-gcc"

# https://doc.rust-lang.org/cargo/reference/profiles.html#custom-profiles
[profile.release-lto]
inherits = "release"

# Enables Link Time Optimization for better performance.
# true or "fat" Performs "fat" LTO which attempts to perform optimizations
# across all crates within the dependency graph.
# https://doc.rust-lang.org/cargo/reference/profiles.html#lto
lto = true

# Reduces the number of codegen units to 1 to improve optimization at the
# cost of longer compile times.
# https://doc.rust-lang.org/cargo/reference/profiles.html#codegen-units
codegen-units = 1

# Optimize for binary size.
# "s" optimizes for size, "z" optimizes even more aggressively for size.
# https://doc.rust-lang.org/cargo/reference/profiles.html#opt-level
opt-level = "s"

# Strips debug symbols from the final binary to reduce size.
# "symbols" removes debug symbols, "debuginfo" keeps them.
# https://doc.rust-lang.org/cargo/reference/profiles.html#strip
strip = "symbols"
