[package]
# Test configuration for ssamd
extension = "ssam"
cgroup = ""
public_key = "/var/lib/ssamd/keys/test.pub.key"

[package.dir]
builtin = "/var/lib/ssamd/builtin"
downloaded = "/var/lib/ssamd/downloaded"
oci_bundle = "/var/lib/ssamd/oci-bundle"
data = "/var/lib/ssamd/data"

[debug]
pkgfs_overlay_dir = ""
disable_pkgfs_integrity = false
disable_package_verify = false

[network.bridge]
enabled = true

[network.bridge.addr_pool]
base = "172.20.0.0/16"
size = 29
