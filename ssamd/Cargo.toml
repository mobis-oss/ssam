[package]
name = "ssamd"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "ssamd"
path = "src/lib.rs"

[[bin]]
name = "ssamd"
path = "src/main.rs"

[features]
default = ["dm-verity"]
dm-verity = []
profile = []

[dependencies]
libssam.workspace = true
ssam-log.workspace = true
simplelog.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "signal",
    "rt",
    "rt-multi-thread",
] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
zbus_systemd = { version = "0.26100", features = ["systemd1"] }
futures-util = "0.3.34"
sd-notify = "0.5"
log.workspace = true
loopdev-3 = "0.5.3"
anyhow.workspace = true
serde.workspace = true
serde-big-array.workspace = true
bincode.workspace = true
tonic.workspace = true
async-trait = "0.1.92"
strum.workspace = true
strum_macros.workspace = true
once_cell = "1.21.4"
tempfile.workspace = true
rustix = { workspace = true, features = ["fs", "mount", "time", "thread"] }
quotactl-rs = { path = "../quotactl-rs" }
thiserror.workspace = true
linux-raw-sys = { workspace = true, features = ["loop_device", "general", "ioctl"] }
procfs = "0.18"
oci-spec.workspace = true
cgroups-rs = "0.5"
tokio-stream = { version = "0.1.19", features = ["fs"] }
rsactor = "0.17"
derive_more.workspace = true
tokio-util = "0.7.19"
semver.workspace = true
rsa.workspace = true
toml.workspace = true
serde_json.workspace = true
prost-types.workspace = true
uuid = { version = "1", features = ["v4", "fast-rng"] }
hex = "0.4"
ipnet = "2"
netavark = { version = "2.1.0", default-features = false }
netlink-packet-route = "0.31"

[dev-dependencies]
mockall = "0.15"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(coverage,coverage_nightly)',
] }
