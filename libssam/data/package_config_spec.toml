[package]
name = "package_name"
description = "A short description of the package"
version = "0.0.1"
#:Opt:# package.autostart
autostart = true  # default is true

[container]
#:Opt:# container.storage_limit
storage_limit = 1000 # Kilobytes
#:Opt:# container.data_dirs
data_dirs = "/container/path1:container/path2:container/path3"

[container.security]
seccomp = true # default is true
mac = true # default is true

#:Opt:# container.network
[container.network]
#:Opt:# container.network.mode
mode = "host" # one of: host | bridge | none

#:Opt:# container.network.bridge
[container.network.bridge]
#:Opt:# container.network.bridge.network_name
network_name = "shared-net-a"
#:Opt:# container.network.bridge.interface_name
interface_name = "eth0"
#:Opt:# container.network.bridge.port_mappings
port_mappings = ["8080:80", "8443:443/tcp", "5353:53/udp"]

[service]
service_type = "simple"
#:Opt:# service.bus_name
bus_name = "my.bus.interface.name"
#:Opt:# service.remain_after_exit
remain_after_exit = false
